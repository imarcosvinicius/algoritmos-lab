name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Testes e Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: dmg

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file \
            desktop-file-utils

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências Frontend e rodar Vitest + Build Vite
        run: |
          npm ci
          npm test
          npm run build

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo (workspace + src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Verificar Rust Core e CLI (clippy + testes + suíte Golden)
        run: |
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo test --workspace --locked
          cargo run --locked -q -p algoritmoslab-cli -- --golden tests/golden

      - name: Verificar Host Tauri (clippy + testes de sessão)
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Verificar metadados Linux/Flatpak (.desktop e .metainfo.xml)
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/flatpak/io.github.imarcosvinicius.AlgoritmosLab.desktop
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("packaging/flatpak/io.github.imarcosvinicius.AlgoritmosLab.metainfo.xml")'

      - name: Empacotar aplicativo desktop (${{ matrix.bundles }})
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --bundles ${{ matrix.bundles }} -- --locked

      - name: Publicar artefatos de build
        uses: actions/upload-artifact@v7
        with:
          name: algoritmoslab-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/algoritmoslab.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
