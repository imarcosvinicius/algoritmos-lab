[workspace]
resolver = "2"
members = [
    "crates/algoritmoslab-core",
    "crates/algoritmoslab-cli",
]
exclude = [
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["AlgoritmosLab Contributors"]

[workspace.dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
