[package]
name = "algoritmoslab"
version = "0.2.0"
description = "AlgoritmosLab — IDE educacional multiplataforma para Portugol estruturado (.alg)"
authors = ["AlgoritmosLab Contributors"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "algoritmoslab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
algoritmoslab-core = { path = "../crates/algoritmoslab-core" }
